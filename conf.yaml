# PLANETES reduction configuration.
# Scientific parameters are recorded here; the CLI only selects a recipe/target.
schema_version: 1

data_dir: .
output_dir: ./reduced
chunk_frames: 16
# All current camera FITS cubes store their 3D data in extension 1.
input_hdu: 1
log_level: DEBUG
automatic_plots: false

crop:
  x: [0, 1280]
  y: [0, 1024]

# Pixel data are ordered as [flux(telescopes), real(baselines), imag(baselines)].
instrument:
  telescopes: ["4", "3", "2", "1"]
  baselines: ["43", "42", "41", "32", "31", "21"]
  # Detector regions in ascending region order. Internal ABCD order is A, C, B, D.
  abcd_order: ["A", "C", "B", "D"]

calibration:
  frames: [0, 256]
  dark: ./2026_02_05/p2vm2/dark.fits
  flats:
    "4": ./2026_02_05/p2vm2/tel4.fits
    "3": ./2026_02_05/p2vm2/tel3.fits
    "2": ./2026_02_05/p2vm2/tel2.fits
    "1": ./2026_02_05/p2vm2/tel1.fits
  wavelength:
    data: ./2026_02_05/p2vm2/wave.fits
    dark: ./2026_02_05/p2vm2/wave_dark.fits
    dark_frames: [0, 256]
  p2vm:
    "43": ./2026_02_05/p2vm2/bsl43.fits
    "42": ./2026_02_05/p2vm2/bsl42.fits
    "41": ./2026_02_05/p2vm2/bsl41.fits
    "32": ./2026_02_05/p2vm2/bsl32.fits
    "31": ./2026_02_05/p2vm2/bsl31.fits
    "21": ./2026_02_05/p2vm2/bsl21.fits
  phase_reference:
    data: ./2026_02_05/sci2/sci.fits
    dark: ./2026_02_05/sci2/sci_dark.fits
    frames: [0, 512]
    dark_frames: [0, 128]

targets:
  sci:
    data: ./2026_02_05/sci2/sci.fits
    dark: ./2026_02_05/sci2/sci_dark.fits
    frames: [0, 512]
    dark_frames: [0, 128]
  test:
    data: ./2026_02_05/p2vm2/bsl43.fits
    frames: [0, 256]

parameters:
  flat:
    profile_width: 10
    bad_threshold: 5.0
  wavelength:
    detection_sigma: 3.0
    surface_degree: 3
    aberration_degree: 3
    dispersion_degree: 3
    ransac_iterations: 1000000
  resampling:
    wavelength_min_um: 1.15
    wavelength_max_um: 1.30
    wavelength_channels: 151
  p2vm:
    phase_correction: true
  reduction:
    group_delay_min_um: -100.0
    group_delay_max_um: 100.0
  plot:
    full: false
