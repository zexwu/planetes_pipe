[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planetes"
dynamic = ["version"]
description = "PLANETES detector and interferometric reduction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy>=7.2.0",
    "matplotlib>=3.8.4,<4",
    "numba>=0.62.0",
    "numpy>=2.4.2,<3",
    "scipy>=1.16.1,<2",
]

[project.optional-dependencies]
eso = [
    "pycpl @ https://ftp.eso.org/pub/dfs/pipelines/libraries/pycpl/pycpl-1.0.4.post1.tar.gz",
    "pyesorex @ https://ftp.eso.org/pub/dfs/pipelines/libraries/pyesorex/pyesorex-1.0.4.tar.gz",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["planetes*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "planetes.__version__"}

[tool.setuptools.package-data]
planetes = ["data/*.ecsv", "data/*.fits"]
